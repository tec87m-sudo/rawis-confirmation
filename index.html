
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تأكيد البريد | راوس</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 36px 24px;
      margin: 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 8px 30px #00000012;
    }
    .check { font-size: 64px; color: #16a34a; }
    h1 { font-size: 24px; color: #172033; }
    p { font-size: 17px; line-height: 2; color: #555; }
    .brand { color: #2563eb; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>تم تأكيد بريدك الإلكتروني بنجاح!</h1>
    <p>
      أهلاً بك في <span class="brand">راوس</span><br>
      ارجع الآن إلى تطبيق راوس وسجّل الدخول
      باستخدام بريدك الإلكتروني وكلمة المرور.
    </p>
  </div>
</body>
</html>
